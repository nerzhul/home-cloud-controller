[package]
name = "home-cloud-controller-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
k8s-openapi = { version = "0.29.0", features = ["v1_37"] }
kube = { version = "5.0.0", features = ["client", "runtime", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }
tempfile = "3.27.0"
