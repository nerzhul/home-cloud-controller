# Local e2e overlay: image loaded into kind via `kind load docker-image`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# kindnet does not enforce NetworkPolicy, but keep the classic flavor so the
# e2e render matches a standard cluster.
components:
  - ../../base/components/netpol-classic

images:
  - name: home-cloud-controller-manager
    newName: home-cloud-controller-manager
    newTag: dev
