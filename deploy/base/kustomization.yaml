apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - deployment.yaml
  # No NetworkPolicy in base: an overlay must pick exactly one via `components:`
  # — components/netpol-classic (vanilla NetworkPolicy) or
  # components/netpol-cilium (CiliumNetworkPolicy with the kube-apiserver entity).

images:
  - name: ghcr.io/nerzhul/home-cloud-controller
    newTag: latest
