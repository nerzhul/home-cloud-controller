# Classic Kubernetes NetworkPolicy: egress only to the API server and to
# kube-dns. The in-cluster client connects to the ClusterIP of the
# `kubernetes` service, which kube-proxy DNATs to the control-plane endpoint.
# CNIs evaluate egress policy either pre-DNAT (ClusterIP:443) or post-DNAT
# (node IP, kubeadm default port 6443), and hostNetwork apiserver pods may
# carry no `k8s-app=kube-apiserver` label at all, so a podSelector-only rule
# misses them: allow TCP/443 and TCP/6443 to any destination.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: home-cloud-controller-manager
  namespace: home-cloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: home-cloud-controller-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # kubelet HTTP probes arrive from the node itself, not from a pod, so they
    # cannot be matched with a podSelector; expose only the health port.
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    # Any destination on 443/6443: covers the `kubernetes` service ClusterIP
    # (pre-DNAT) and the control-plane node endpoint (post-DNAT), regardless
    # of how the apiserver pods are labelled.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: coredns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
